{% extends "base.html" %}
{% block title %}Edit {{ page.title }} - Local Confluence{% endblock %}
{% block content %}
<article class="page">
  <h1>Edit page</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('edit_page', slug=page.id) }}">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ title or '' }}" required>

    <label>Content</label>
    {% include "_editor.html" %}

    <div class="form-actions">
      <button type="submit" class="btn">Save Changes</button>
      <a class="btn btn-secondary" href="{{ url_for('view_page', slug=page.id) }}">Cancel</a>
    </div>
  </form>
</article>
{% endblock %}
